[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "railpulse-oncf"
version = "0.1.0"
description = "SNCF open-data railway punctuality analytics (independent ONCF-inspired project)"
requires-python = ">=3.10"
dependencies = ["pandas>=2,<3", "numpy>=1.24,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dashboard = ["streamlit>=1.35,<2"]
[project.scripts]
railpulse = "railpulse.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
